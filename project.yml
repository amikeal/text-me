# Generates Cubby.xcodeproj. Run `xcodegen generate` in this folder (brew install xcodegen).
name: Cubby

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

configFiles:
  Debug: Config/Cubby.xcconfig
  Release: Config/Cubby.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "YES"

packages:
  CubbyCore:
    path: Packages/CubbyCore

targets:
  Cubby:
    type: application
    platform: iOS
    sources:
      - path: Cubby
      - path: SharedIntents
    dependencies:
      - package: CubbyCore
      - target: CubbyShare
      - target: CubbyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CUBBY_BUNDLE_ID)
        PRODUCT_NAME: Cubby
        INFOPLIST_FILE: Cubby/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cubby/Cubby.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity

  CubbyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CubbyShare
    dependencies:
      - package: CubbyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CUBBY_BUNDLE_ID).share
        INFOPLIST_FILE: CubbyShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: CubbyShare/CubbyShare.entitlements

  CubbyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CubbyWidget
      - path: SharedIntents
    dependencies:
      - package: CubbyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CUBBY_BUNDLE_ID).widget
        INFOPLIST_FILE: CubbyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CubbyWidget/CubbyWidget.entitlements

  CubbyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CubbyUITests
    dependencies:
      - target: Cubby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CUBBY_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Cubby

schemes:
  Cubby:
    build:
      targets:
        Cubby: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CubbyUITests
    archive:
      config: Release
