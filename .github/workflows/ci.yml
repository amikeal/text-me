name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core logic tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Test CubbyCore
        working-directory: Packages/CubbyCore
        run: swift test

      - name: Run the rule-based classifier on the sample notes
        working-directory: eval/harness
        run: swift run cubby-eval heur ../sample/entries.sample.jsonl ../out/heur.jsonl

      - name: Score it (informational; the sample is made up)
        run: python3 eval/score.py --gold eval/sample/entries.sample.jsonl --pred eval/out/heur.jsonl --errors || true

  app:
    name: Build app and take screenshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cubby.xcodeproj \
            -scheme Cubby \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || true
          echo "--- warnings and errors ---"
          grep -E "(warning|error):" build.log | sort -u || true
          echo "---"
          grep -q "BUILD SUCCEEDED" build.log || { tail -80 build.log; exit 1; }

      - name: UI tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro \(|iPhone 1[6-9] \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Testing on $DEVICE"
          xcodebuild test \
            -project Cubby.xcodeproj \
            -scheme Cubby \
            -destination "id=$DEVICE" \
            -derivedDataPath build \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > ui-tests.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "Test Case .*(passed|failed)|error:|Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)" ui-tests.log || tail -80 ui-tests.log
          exit $STATUS

      - name: Screenshots with demo data (light and dark)
        if: always()
        run: |
          set -x
          APP=$(find build/Build/Products -name "Cubby.app" -maxdepth 3 | head -1)
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro \(|iPhone 1[6-9] \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEVICE" || true   # already booted if the UI tests ran
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p screenshots
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance $MODE
            for SCREEN in capture timeline; do
              xcrun simctl terminate "$DEVICE" "$BUNDLE" || true
              xcrun simctl launch "$DEVICE" "$BUNDLE" -cubbyDemo -cubbyRulesOnly -startScreen $SCREEN
              sleep 6
              xcrun simctl io "$DEVICE" screenshot "screenshots/$SCREEN-$MODE.png"
            done
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            ui-tests.log
          if-no-files-found: ignore
